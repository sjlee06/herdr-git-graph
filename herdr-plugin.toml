id = "herdr.git-graph"
name = "Herdr Git Graph"
version = "0.5.0"
min_herdr_version = "0.9.5"
description = "Interactive Git commit and branch graph with smooth curves, search, and diffs."
platforms = ["macos", "linux"]

[[build]]
command = ["sh", "scripts/install.sh"]

[[actions]]
id = "open"
title = "Open Git Graph"
contexts = ["workspace"]
command = ["./bin/herdr-git-graph", "--open-pane"]

[[actions]]
id = "sidebar"
title = "Open Git Graph Sidebar"
contexts = ["workspace"]
command = ["./bin/herdr-git-graph", "--open-sidebar"]

[[actions]]
id = "toggle-sidebar"
title = "Toggle Git Graph Sidebar"
contexts = ["workspace"]
command = ["./bin/herdr-git-graph", "--toggle-sidebar"]

[[events]]
on = "tab.focused"
command = ["./bin/herdr-git-graph", "--sync-sidebar"]

[[events]]
on = "tab.closed"
command = ["./bin/herdr-git-graph", "--sync-sidebar"]

[[events]]
on = "pane.closed"
command = ["./bin/herdr-git-graph", "--sync-sidebar"]

[[events]]
on = "pane.exited"
command = ["./bin/herdr-git-graph", "--sync-sidebar"]

[[panes]]
id = "graph"
title = "Git Graph"
placement = "tab"
command = ["./bin/herdr-git-graph"]

[[panes]]
id = "sidebar"
title = "Git Graph Sidebar"
placement = "split"
command = ["./bin/herdr-git-graph", "--sidebar"]
