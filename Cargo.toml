[package]
name = "herdr-git-graph"
version = "0.3.0"
edition = "2024"
description = "Interactive Git commit and branch graph for Herdr"
license = "MIT"
repository = "https://github.com/sjlee06/herdr-git-graph"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
ratatui = "0.30"
serde_json = "1"
tiny-skia = "0.11"

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
