name: Rust
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: python3 tests/install.py
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: sh scripts/build.sh
      - run: ./bin/herdr-git-graph --demo --check
      - run: python3 tests/scroll_pty.py bin/herdr-git-graph
      - name: Check minimum and current Herdr compatibility
        shell: bash
        run: |
          case "$(uname -s)" in
            Darwin) platform=macos ;;
            Linux) platform=linux ;;
            *) exit 1 ;;
          esac
          case "$(uname -m)" in
            arm64|aarch64) arch=aarch64 ;;
            x86_64) arch=x86_64 ;;
            *) exit 1 ;;
          esac
          # Pin the floor independently of the manifest: raising it must fail CI.
          for version in 0.9.0 0.9.5; do
            directory="$RUNNER_TEMP/herdr-$version"
            mkdir -p "$directory"
            curl --fail --location --retry 3 \
              "https://github.com/herdrdev/herdr/releases/download/v$version/herdr-$platform-$arch" \
              --output "$directory/herdr"
            chmod +x "$directory/herdr"
            "$directory/herdr" --version
            PATH="$directory:$PATH" python3 tests/herdr_live.py
            PATH="$directory:$PATH" python3 tests/sidebar_layout_live.py bin/herdr-git-graph
          done
